# One Canton node for the registry and Omni-Stance: a participant (the ledger both apps use),
# with its own sequencer and mediator, all stored in Postgres so nothing is lost on a restart.
# Until it joins a shared network (DevNet), this node is its own private synchronizer.
_storage {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = {
      serverName = ${PGHOST}
      portNumber = ${PGPORT}
      user = ${PGUSER}
      password = ${PGPASSWORD}
      ssl = ${?PGSSL}
    }
  }
  parameters.max-connections = 8
}

# Railway's private network is IPv6, so the node listens on "::"; CANTON_BIND overrides it.
_bind = "::"
_bind = ${?CANTON_BIND}

canton {
  parameters.non-standard-config = yes
  participants.node {
    storage = ${_storage} { config.properties.databaseName = "canton_participant" }
    admin-api { address = ${_bind}, port = 6866 }
    ledger-api {
      address = ${_bind}
      port = 6865
      user-management-service.enabled = true
    }
    http-ledger-api.server { address = ${_bind}, port = 7575 }
  }
  sequencers.sequencer1 {
    storage = ${_storage} { config.properties.databaseName = "canton_sequencer" }
    admin-api { address = "127.0.0.1", port = 6868 }
    public-api { address = "127.0.0.1", port = 6867 }
    sequencer { type = reference, config.storage = ${_storage} { config.properties.databaseName = "canton_sequencer_driver" } }
  }
  mediators.mediator1 {
    storage = ${_storage} { config.properties.databaseName = "canton_mediator" }
    admin-api { address = "127.0.0.1", port = 6869 }
  }
}
